# ============================================================
# Culex pipiens Complex Pangenome - Pipeline Configuration
# ============================================================
 
# -- Sample metadata --
samples: config/samples.tsv
 
# -- Reference genome (annotation donor for Liftoff) --
reference:
  name: Cx_quinquefasciatus
  accession: GCF_015732765.1
 
# -- Outgroup for rooting and the D statistics (V5) --
# Culex (Culex) perexiguus, Pipiens Group, Univittatus Subgroup: outside the
# Cx. pipiens complex. Chromosome level ERGA assembly idCulPerx1.1 (PacBio
# HiFi with Hi-C scaffolding) with its own Ensembl gene set. V1 to V4 used
# Cx. tarsalis CtarK1, a contig level assembly whose transferred gene models
# were mostly broken.
# download.smk takes the genome and the gene set from the Ensembl FTP (so
# their sequence names match) and picks the newest gene set release under
# ensembl_base. If Ensembl moves the files, put the full URLs of the gzipped
# FASTA and GFF3 in genome_url and gff_url.
outgroup:
  name: Cx_perexiguus
  accession: GCA_964243045.1
  assembly: idCulPerx1.1
  ensembl_base: https://ftp.ebi.ac.uk/pub/ensemblorganisms/Culex_perexiguus/GCA_964243045.1
  genome_url: ""
  gff_url: ""
 
# -- BUSCO parameters --
busco:
  lineage: diptera_odb10
  mode: genome
 
# -- Liftoff annotation transfer --
# Liftoff runs WITHOUT -copies and WITHOUT -polish, and with default
# alignment coverage (-a 0.5). The two values below are passed as:
#   -s  identity_threshold    child features (exons, CDS) must align at
#                             >= this sequence identity for a gene to map
#   -sc copy_identity         identity for extra copies; has no effect
#                             unless -copies is given, so it is inert here
# (copy_identity was previously named coverage_threshold, which it is not.)
liftoff:
  copy_identity: 0.95
  identity_threshold: 0.90
 
# -- OrthoFinder --
orthofinder:
  method: msa
  search: diamond
 
# -- IQ-TREE phylogenetics --
iqtree:
  model: MFP
  bootstrap: 1000
 
# -- D statistics (ABBA BABA) with the outgroup (V5) --
# Planned tests, fixed before the run from the four taxon species tree
# ((Cx_pallens, Cx_quinquefasciatus), (Cx_molestus, Cx_pipiens)), each as
# [P1, P2, P3], with the outgroup as O. D > 0: P2 and P3 share more derived
# alleles; D < 0: P1 and P3 do.
# Gene flow between pallens and pipiens gives D < 0 in the first test and
# D > 0 in the third, and usually D > 0 in the fourth too, because alleles
# from the pallens lineage carry the history it shares with quinquefasciatus
# (the simulation in tests/test_rooted_analyses.py shows both). Likewise gene
# flow between quinquefasciatus and molestus gives D > 0 in the second test,
# D < 0 in the fourth and usually D < 0 in the third. So the third and fourth
# tests show which of molestus and pipiens took part, and the first two which
# of pallens and quinquefasciatus.
# A planned test the rooted tree contradicts is still run, flagged, and the
# test the tree implies is added. Loci are grouped into windows of block_size
# bp of the reference assembly for the block jackknife.
dstat:
  block_size: 5000000
  tests:
    - [Cx_pallens, Cx_quinquefasciatus, Cx_pipiens]
    - [Cx_pallens, Cx_quinquefasciatus, Cx_molestus]
    - [Cx_molestus, Cx_pipiens, Cx_pallens]
    - [Cx_molestus, Cx_pipiens, Cx_quinquefasciatus]

# -- CAFE5 gene family evolution --
cafe:
  pvalue_threshold: 0.05
  n_gamma_categories: 3
 
# -- Minimap2 genome alignment --
minimap2:
  preset: asm5
 
# -- RepeatMasker --
repeatmasker:
  species: culex

# -- Repeat library --
# The RepeatModeler library depends only on the Cx. quinquefasciatus assembly,
# so V5 reuses the V4 library (about 18 hours of RepeatModeler) from the
# repository. Set prebuilt_library to "" to build it again.
repeats:
  prebuilt_library: data/repeat_library/custom_repeat_lib_V4.fa
 
# -- Compute resources --
# For c7i.24xlarge (96 vCPU, 192 GB RAM) — use most cores per rule and let
# Snakemake fan out jobs across the rest.
threads: 32
memory_gb: 128
